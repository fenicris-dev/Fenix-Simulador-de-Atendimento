<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040798">
<title>Fênix | Simulado de Atendimento</title>
<meta name="description" content="Treinamento de atendimento de call center por voz, com 8 passos, personas, avaliação e gamificação.">
<!-- Fênix | Simulado de Atendimento | v1.0 | Livro das Regras v5.8 | Fênix Core c 5.8 -->
<style>
:root{
  --az1:#040798;--az2:#0076CE;--dell:#0076CE;--am:#ffcb00;--fundo:#F3F4F9;--card:#fff;--txt:#020733;--mut:#5b6080;
  --ok:#14804a;--erro:#c0392b;--linha:#e2e5f2;--grad:linear-gradient(135deg,#040798,#0076CE);--gradh:linear-gradient(90deg,#040798,#0076CE);
  --sombra:0 2px 10px rgba(4,7,152,.10);--raio:14px;--menu-w:236px;
}
:root[data-tema="escuro"]{--fundo:#0b0d2b;--card:#15183f;--txt:#eceefc;--mut:#a3a8d6;--linha:#2a2f66;--sombra:0 2px 10px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--txt);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}
h1{font-size:1.4rem}h2{font-size:1.15rem}h3{font-size:1rem}
a{color:var(--dell)}
.oculto{display:none!important}
/* splash */
#splash{position:fixed;inset:0;background:#041273;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;transition:opacity .35s}
#splash img{width:96px;height:96px;border-radius:22px}
#splash h1{margin:14px 0 2px;font-size:1.25rem}
#splash p{margin:0;opacity:.85;font-size:.9rem}
.barra-vv{position:relative;width:160px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin-top:22px;overflow:hidden}
.barra-vv i{position:absolute;top:0;left:0;height:100%;width:40%;background:var(--am);border-radius:5px;animation:vv 1.1s ease-in-out infinite alternate}
@keyframes vv{from{left:0}to{left:60%}}
.sem-anim *{animation:none!important;transition:none!important}
/* layout */
#app{display:flex;min-height:100vh}
#menu{width:var(--menu-w);background:var(--grad);color:#fff;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}
#menu .marca{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700}
#menu .marca img{width:38px;height:38px;border-radius:9px}
#menu .marca small{display:block;font-weight:400;opacity:.85;font-size:.72rem}
#menu button.item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border:0;background:transparent;color:#fff;border-radius:10px;cursor:pointer;text-align:left;font-size:.95rem}
#menu button.item:hover,#menu button.item.ativo{background:rgba(255,255,255,.18)}
#menu button.item:hover{color:var(--am)}
#menu button.item.ativo{box-shadow:inset 3px 0 0 var(--am)}
#menu .grow{flex:1}
#menu .selo{font-size:.72rem;opacity:.85;padding:6px 10px}
#principal{flex:1;min-width:0;display:flex;flex-direction:column}
#topo{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--grad);color:#fff;position:sticky;top:0;z-index:20}
#topo .tit{flex:1;font-weight:700;font-size:1.05rem}
#conexao{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;opacity:.95}
#conexao i{width:9px;height:9px;border-radius:50%;background:#7CFC9A;display:inline-block}
#conexao.off i{background:var(--am)}
.avatar{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--az1);font-weight:800;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
#menu-av{position:absolute;right:12px;top:58px;background:var(--card);color:var(--txt);border-radius:12px;box-shadow:var(--sombra);min-width:210px;z-index:40;padding:8px}
#menu-av .nome{padding:6px 10px;font-weight:700;border-bottom:1px solid var(--linha);margin-bottom:4px;word-break:break-word}
#menu-av button{display:block;width:100%;min-height:44px;text-align:left;padding:8px 10px;background:transparent;border:0;border-radius:8px;cursor:pointer}
#menu-av button:hover{background:var(--fundo)}
#conteudo{padding:16px;max-width:1100px;width:100%;margin:0 auto;flex:1;padding-bottom:96px}
#rodape{background:var(--gradh);color:#fff;text-align:center;padding:12px 10px 78px;font-size:.82rem}
#rodape a{color:#fff;text-decoration:underline}
#rodape .aviso-emp{display:block;margin-top:6px;font-size:.74rem;opacity:.95;background:rgba(0,0,0,.18);padding:6px 10px;border-radius:8px;max-width:760px;margin-left:auto;margin-right:auto}
#abas{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--linha);display:none;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
#abas .linha{display:flex;align-items:flex-end;justify-content:space-around}
#abas button{flex:1;min-height:56px;border:0;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;cursor:pointer}
#abas button.ativo{color:var(--dell);font-weight:700}
#abas button.central{flex:0 0 76px;position:relative;top:-14px;color:#fff;font-weight:700}
#abas button.central span.bola{width:60px;height:60px;border-radius:50%;background:var(--dell);border:4px solid var(--am);display:flex;align-items:center;justify-content:center;box-shadow:var(--sombra)}
#abas button.central.ativo{color:var(--dell)}
#abas button.central .bola{color:#fff}
#abas button.central b{color:var(--dell);font-size:.68rem}
@media (max-width:820px){
  #menu{display:none}
  #abas{display:block}
  #conteudo{padding:12px;padding-bottom:104px}
}
@media (min-width:821px){#topo .avatar{width:40px;height:40px}}
/* componentes */
.card{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:16px;margin-bottom:14px}
.grade{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ind{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:14px;border:0;text-align:left;cursor:pointer;min-height:84px;width:100%}
.ind:hover{outline:2px solid var(--am)}
.ind .n{font-size:1.7rem;font-weight:800;color:var(--az1)}
:root[data-tema="escuro"] .ind .n{color:#8fc7ff}
.ind .r{font-size:.82rem;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border:0;border-radius:10px;background:var(--dell);color:#fff;font-weight:700;cursor:pointer}
.btn:hover{background:var(--am);color:#020733}
.btn.sec{background:transparent;color:var(--dell);border:2px solid var(--dell)}
.btn.sec:hover{background:var(--am);border-color:var(--am);color:#020733}
.btn.perigo{background:var(--erro)}
.btn.perigo:hover{background:#8e1f13;color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.peq{min-height:44px;padding:6px 12px;font-size:.88rem}
label.campo{display:block;margin:10px 0}
label.campo span{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px}
label.campo small{display:block;color:var(--mut);margin-top:3px;font-size:.78rem}
input[type=text],input[type=email],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--linha);border-radius:10px;background:var(--card);color:#000}
:root[data-tema="escuro"] input,:root[data-tema="escuro"] select,:root[data-tema="escuro"] textarea{background:#fff;color:#000}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--am);outline-offset:1px}
.linha-form{display:flex;gap:10px;flex-wrap:wrap}.linha-form>*{flex:1;min-width:140px}
.aviso{background:#fff7d6;border-left:5px solid var(--am);padding:10px 12px;border-radius:8px;color:#4a3b00;font-size:.88rem;margin:10px 0}
:root[data-tema="escuro"] .aviso{background:#3a3200;color:#ffe9a0}
.aviso.erro{background:#fde7e4;border-color:var(--erro);color:#7a1d12}
.aviso.ok{background:#e1f5ea;border-color:var(--ok);color:#0c4d2c}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:4px 12px;border-radius:20px;border:1px solid var(--linha);background:var(--card);cursor:pointer;font-size:.85rem;margin:0 6px 6px 0}
.chip.ativo{background:var(--dell);color:#fff;border-color:var(--dell)}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:.74rem;font-weight:700;background:var(--fundo);color:var(--mut)}
.tag.am{background:var(--am);color:#020733}.tag.az{background:var(--dell);color:#fff}.tag.ok{background:#d3f0e0;color:#0c4d2c}.tag.er{background:#fde7e4;color:#7a1d12}
details.sec{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);margin-bottom:10px}
details.sec>summary{cursor:pointer;padding:14px 16px;font-weight:700;min-height:44px;list-style:none}
details.sec>summary::after{content:"▾";float:right}
details.sec[open]>summary::after{content:"▴"}
details.sec>.corpo{padding:0 16px 14px}
table.tab{width:100%;border-collapse:collapse;font-size:.88rem}
table.tab th,table.tab td{padding:8px 6px;border-bottom:1px solid var(--linha);text-align:left}
table.tab tr.clica{cursor:pointer}table.tab tr.clica:hover{background:var(--fundo)}
.vazio,.carregando,.erro-msg{text-align:center;padding:26px 12px;color:var(--mut)}
.erro-msg{color:var(--erro)}
.carregando::before{content:"";display:inline-block;width:18px;height:18px;border:3px solid var(--linha);border-top-color:var(--dell);border-radius:50%;margin-right:8px;vertical-align:-4px;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* modal */
#modal{position:fixed;inset:0;background:rgba(2,7,51,.55);z-index:5000;display:flex;align-items:center;justify-content:center;padding:14px}
#modal .caixa{background:var(--card);color:var(--txt);border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#modal .acoes{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#020733;color:#fff;padding:10px 16px;border-radius:12px;z-index:6000;max-width:92vw;font-size:.9rem;box-shadow:var(--sombra)}
/* faixa */
.faixa{padding:9px 14px;font-size:.86rem;font-weight:600;text-align:center}
.faixa.am{background:var(--am);color:#020733}
.faixa.er{background:var(--erro);color:#fff}
#faixa-sup{position:sticky;top:0;z-index:25;background:#d4145a;color:#fff;text-align:center;padding:9px;font-weight:700}
/* chamada */
.chamada{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:960px){.chamada{grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr)}}
.cron{display:flex;gap:10px;flex-wrap:wrap}
.cron .rel{flex:1;min-width:130px;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--sombra);text-align:center}
.cron .rel .t{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.cron .rel .l{font-size:.74rem;color:var(--mut)}
.cron .rel.v .t{color:var(--ok)}.cron .rel.a .t{color:#b58900}.cron .rel.r .t{color:var(--erro)}
.cron .rel.pausa{background:var(--am);color:#020733}
.passos{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.passos span{flex:1;min-width:28px;text-align:center;padding:5px 2px;border-radius:8px;background:var(--linha);font-size:.72rem;font-weight:700;color:var(--mut)}
.passos span.feito{background:#d3f0e0;color:#0c4d2c}.passos span.atual{background:var(--dell);color:#fff}
.chat{height:300px;overflow:auto;background:var(--fundo);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.bolha{max-width:86%;padding:8px 12px;border-radius:14px;font-size:.93rem;word-wrap:break-word}
.bolha.a{align-self:flex-end;background:var(--dell);color:#fff;border-bottom-right-radius:4px}
.bolha.c{align-self:flex-start;background:var(--card);border:1px solid var(--linha);border-bottom-left-radius:4px}
.bolha.s{align-self:center;background:transparent;color:var(--mut);font-size:.8rem;text-align:center}
.bolha b{display:block;font-size:.68rem;opacity:.75;margin-bottom:1px}
.entrada{display:flex;gap:8px;margin-top:10px}
.entrada input{flex:1}
.mic{min-width:56px;border-radius:50%!important;width:56px;height:56px;padding:0!important}
.mic.gravando{background:var(--erro);animation:pulsa 1s infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 10px rgba(192,57,43,.25)}}
.check{list-style:none;margin:0;padding:0}
.check li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:.88rem;border-bottom:1px dashed var(--linha)}
.check li .ic{width:20px;height:20px;border-radius:50%;border:2px solid var(--linha);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;margin-top:1px}
.check li.ok .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.check li.opt{opacity:.8}
.modelo{background:#eaf3fd;border-left:4px solid var(--dell);padding:8px 10px;border-radius:8px;font-size:.88rem;margin:8px 0;color:#0a2a4a}
:root[data-tema="escuro"] .modelo{background:#12315a;color:#dcecff}
.proto{font-size:1.3rem;font-weight:800;letter-spacing:2px;text-align:center;padding:10px;background:var(--am);color:#020733;border-radius:10px}
.nota-grande{font-size:3rem;font-weight:900;text-align:center;color:var(--az1)}
:root[data-tema="escuro"] .nota-grande{color:#8fc7ff}
.barra-prog{height:10px;border-radius:6px;background:var(--linha);overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--gradh)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--fundo);margin:0 8px 8px 0;font-size:.85rem}
.badge.bloq{opacity:.45;filter:grayscale(1)}
.lista-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.lista-item .grow{flex:1;min-width:150px}
.lista-item.bloq{opacity:.55}
.ajuda-md h1,.ajuda-md h2,.ajuda-md h3{margin-top:1em}
.ajuda-md table{border-collapse:collapse;width:100%;font-size:.85rem}.ajuda-md td,.ajuda-md th{border:1px solid var(--linha);padding:4px 6px}
.ajuda-md code{background:var(--fundo);padding:1px 5px;border-radius:4px}
.ajuda-md blockquote{border-left:4px solid var(--am);margin:8px 0;padding:2px 10px;background:var(--fundo)}
.ajuda-md img{max-width:100%;border:1px solid var(--linha);border-radius:8px}
@media print{#menu,#topo,#abas,#rodape,#toast,.nao-imprimir{display:none!important}body{background:#fff;color:#000}#conteudo{padding:0}.card{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<div id="splash"><img id="splash-logo" alt="Fênix"><h1>Simulado de Atendimento</h1><p>Fênix Soluções Tecnológicas</p><div class="barra-vv"><i></i></div></div>
<div id="raiz" class="oculto"></div>
<div id="modal-raiz"></div>
<div id="toast-raiz"></div>
<script>
/* ===== BASE: utilitários, estado, núcleo (core), áudio, voz, gravação ===== */
var VERSAO='1.0', CORE_VER='5.8', LIVRO_VER='5.8', ESQUEMA=1;
var CORE_URL='https://fenicris-dev.github.io/Fenix-Core/fenix-core.js';
var BASE_PAGES='https://fenicris-dev.github.io/Fenix-Core/';
var LINKS={termos:BASE_PAGES+'Termos/',politica:BASE_PAGES+'Termos/',wa:'https://wa.me/5579999680880',ig:'https://www.instagram.com/fenixsolucoestecnologicas/'};
var AVISO_EMPRESA='Nome digitado por você, apenas para treino. Este app não tem vínculo, patrocínio ou aprovação da empresa citada, e não usa logo ou materiais oficiais dela. O uso do nome é de sua responsabilidade.';
var KEY='fenixSimulado.v1';

/* ---------- utilitários ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s@.]/g,' ').replace(/\s+/g,' ').trim();}
function has(t,re){return new RegExp(re).test(t);}
function pad(n){return (n<10?'0':'')+n;}
function fmtData(d){d=new Date(d);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function fmtHora(d){d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtDur(s){s=Math.max(0,Math.round(s));return pad(Math.floor(s/60))+':'+pad(s%60);}
function fmtNum(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function chance(p){return Math.random()<p;}
function primeiroNome(n){return String(n||'').trim().split(/\s+/)[0]||'';}
function iniciais(n){var p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
function saudacao(d){var h=(d||new Date()).getHours();return h<12?'bom dia':(h<18?'boa tarde':'boa noite');}
function Saudacao(d){var s=saudacao(d);return s.charAt(0).toUpperCase()+s.slice(1);}
function hojeChave(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function semanaChave(d){d=new Date(d||Date.now());var t=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-S'+Math.ceil(((d-t)/86400000+t.getDay()+1)/7);}
function mesChave(d){d=new Date(d||Date.now());return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function baixar(nome,conteudo,tipo){var b=conteudo instanceof Blob?conteudo:new Blob([conteudo],{type:tipo||'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
function cloneJ(o){return JSON.parse(JSON.stringify(o));}

/* ---------- logo provisória (águia) até o arquivo oficial ---------- */
var LOGO_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040798"/><stop offset="1" stop-color="#0076CE"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#g)"/><path fill="#fff" d="M50 24c3 0 5 2 6 5l3 7 24-14-10 24-12 4-6 8 4 12-9-6-9 6 4-12-6-8-12-4L6 22l24 14 3-7c1-3 3-5 6-5z" transform="translate(4 8) scale(.92)"/><circle cx="50" cy="31" r="3" fill="#ffcb00"/></svg>';
var LOGO='data:image/svg+xml;base64,'+btoa(LOGO_SVG);

/* ---------- estado ---------- */
var S=null;
function estadoPadrao(){return {_v:ESQUEMA,perfil:null,armazenamento:'',
 prefs:{somFundo:true,toque:true,animacoes:true,tema:'claro',autoMic:true,gravar:false,dica:false},
 pesos:{abertura:15,confirmacao:15,entrevista:25,protocolo:20,pausas:10,despedida:10,tempo:5},
 niveis:[0,500,1500,3500,7000],roteiros:[],sims:[],xp:0,badges:{},streak:{dias:0,ultimo:''},
 campanha:{ligada:false},metas:{},comentarios:{},criadoEm:new Date().toISOString(),modificadoEm:new Date().toISOString()};}
function carregar(){try{var j=localStorage.getItem(KEY);S=j?JSON.parse(j):estadoPadrao();}catch(e){S=estadoPadrao();}
 var P=estadoPadrao();for(var k in P){if(S[k]===undefined)S[k]=P[k];}
 for(var k2 in P.prefs){if(S.prefs[k2]===undefined)S.prefs[k2]=P.prefs[k2];}
 for(var k3 in P.pesos){if(S.pesos[k3]===undefined)S.pesos[k3]=P.pesos[k3];}
 S._v=ESQUEMA;}
function salvar(){S.modificadoEm=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){aviso('Não foi possível salvar no aparelho. O espaço pode estar cheio.');}}

/* ---------- ciclo da chamada ---------- */
function novaChamada(rid,pid,modo){
 var sc=resolverCenario(rid),pers=persona(pid);
 var c=criarCtx(sc);c.pers=pers;
 CH={id:uid(),modo:modo,sc:sc,pers:pers,ctx:c,estado:'tocando',pi:0,feitos:{},hookFired:{},hookOk:{},tempos:[],tme:0,erros:[],errosN:{},dicas:0,msgs:[],linha:[],
  inicio:null,pInicio:null,fim:null,pac:pers.pac,pac0:pers.pac,esp:null,desvioPend:null,desvTot:0,desvOk:0,desvPasso:0,repPend:false,respDef:null,repTot:0,repOk:0,
  tecPend:false,tecFeito:false,tecOk:0,empat:0,usoNome:0,interrup:0,nUtter:0,ameacou:false,alo:false,penTempo:{},foraOrd:{},obs:false,gravar:false};

function conectarChamada(){var c=CH;if(!c)return;c.estado='ativa';c.inicio=Date.now();c.pInicio=c.inicio;
 if(S.prefs.somFundo)Aud.fundoOn();Voz.sortear();

function msg(tipo,txt){var c=CH;if(!c)return;var t=c.inicio?Math.round((Date.now()-c.inicio)/1000):0;c.msgs.push({tipo:tipo,txt:txt,t:t});c.linha.push({t:t,tipo:tipo,txt:txt,p:c.pi+1});Gancho.render();Gancho.estado();}
function erro(id,extra){var c=CH;if(!c)return;var d=ERROS[id];if(!d)return;

 if(['giria','tempo','fora_ordem'].indexOf(id)<0||c.errosN[id]<=3){c.erros.push({id:id,p:c.pi+1,t:c.inicio?Math.round((Date.now()-c.inicio)/1000):0,extra:extra||''});}
 c.pac=clamp(c.pac+d.pac,0,100);}
function pend(){var c=CH;return !!(c.repPend||c.tecPend||c.desvioPend);}
function passoCompleto(){var c=CH,st=c.passos[c.pi];return st.itens.every(function(i){return !i.req||c.feitos[c.pi+':'+i.id];});}

function decorar(txt,pers){var s=txt;
 if(pers.pre&&pers.pre.length&&chance(.4)){var p=pick(pers.pre);if(p)s=p+s.charAt(0).toLowerCase()+s.slice(1);}
 if(pers.pos&&pers.pos.length&&chance(.3)){var q=pick(pers.pos);if(q){s=s.replace(/[.!?]+$/,'')+(q.charAt(0)==='!'?q:'.'+q);} }

function clienteFala(txt,cb){var c=CH;if(!c)return;Escuta.parar();msg('c',txt);c.falando=true;Gancho.render();
 Voz.falar(txt,c.pers,function(){c.falando=false;Gancho.render();if(cb)cb();});}

function liberado(c,i){if(i.apos&&!c.hookOk[c.pi+':'+i.apos])return false;if(i.dep){for(var k=0;k<i.dep.length;k++){if(!c.feitos[c.pi+':'+i.dep[k]])return false;}}return true;}
function palavras(t){return String(t).trim().split(/\s+/).filter(Boolean).length;}

function enviar(txt){
 var c=CH;if(!c||c.estado!=='ativa')return false;txt=String(txt||'').trim();if(!txt)return false;
 if(c.falando){Voz.parar();c.falando=false;c.interrup++;erro('interrompeu');}
 msg('a',txt);c.nUtter++;
 var t=norm(txt),st=c.passos[c.pi],ctx=c.ctx,novos=[],resps=[];
 if(has(t,GIRIAS))erro('giria');
 if((c.pi===0||c.pi===7)&&has(t,'bom dia|boa tarde|boa noite')&&!has(t,ctx.saud))erro('saud_errada');
 /* pendências do cliente */
 var antes=c.respDef;
 if(c.desvioPend){if(has(t,EMPATIA)){c.desvOk++;c.empat++;c.pac=clamp(c.pac+6,0,100);c.desvioPend=null;}
  else{c.desvioPend.tent++;if(c.desvioPend.tent>=2){erro('desvio_ignorado');c.desvioPend=null;}else{c.pac=clamp(c.pac-4,0,100);}}}
 if(c.repPend){if(palavras(t)>=3&&!has(t,GIRIAS)){c.repOk++;c.repPend=false;if(c.respDef){resps=resps.concat(c.respDef);c.respDef=null;}}else{erro('nao_repetiu');c.repPend=false;if(c.respDef){resps=resps.concat(c.respDef);c.respDef=null;}}}
 if(c.tecPend){if(palavras(t)>=4&&has(t,'quer dizer|ou seja|e uma|e aquela|e aquele|caixa|chave|aparelho|serve|significa|e o relogio|explic|aquilo|e como')){c.tecOk++;c.desvOk++;c.tecPend=false;if(c.respDef){resps=resps.concat(c.respDef);c.respDef=null;}}
  else{erro('sem_explicar');c.tecPend=false;if(c.respDef){resps=resps.concat(c.respDef);c.respDef=null;}}}
 /* se a pendência foi resolvida e o passo já estava completo, avança antes de avaliar a fala */
 var guarda=0;while(!pend()&&c.estado==='ativa'&&c.pi<8&&passoCompleto()&&guarda++<8){avancar();if(c.estado!=='ativa'){Gancho.render();Gancho.estado();return true;}st=c.passos[c.pi];}
 if(c.estado==='fim'||c.pi>=8)return true;
 /* itens do passo atual */
 st.itens.forEach(function(i){var k=c.pi+':'+i.id;if(c.feitos[k]||!liberado(c,i))return;var ok=false;try{ok=i.test(t,ctx,txt);}catch(e){ok=false;}
  if(ok){c.feitos[k]=Date.now()-c.inicio;novos.push(i);if(i.id==='unome')c.usoNome++;}});
 if(c.feitos[c.pi+':pnome']&&inc(t,ctx.cliPrim)&&novos.every(function(x){return x.id!=='unome';}))c.usoNome++;
 if(c.pi===4&&c.hookOk['4:h5']&&!c.feitos['4:proto']){var d=soDigitos(t);if(d.length>=5&&d.indexOf(ctx.protocolo||'x')<0&&d.indexOf((ctx.protocolo||'xxxxxx').slice(-6))<0)erro('proto_errado');}
 if(!novos.length&&c.pi<7&&!c.foraOrd[c.pi]){var prox=c.passos[c.pi+1];if(prox){var fora=false;prox.itens.forEach(function(i){if(i.req&&!i.apos&&!i.dep){try{if(i.test(t,ctx,txt))fora=true;}catch(e){}}});if(fora){c.foraOrd[c.pi]=1;erro('fora_ordem');aviso('Esse item é de um passo à frente. Conclua o passo atual.');}}}
 /* respostas dos itens */
 var novas=[];novos.forEach(function(i){if(i.resp){var r=i.resp(ctx);if(r)novas.push(r);}});
 /* técnico (leigo/idoso) */
 if(c.pers.tec&&!c.tecFeito&&has(t,TECNICO)&&c.pi>=1){c.tecFeito=true;c.tecPend=true;c.respDef=(c.respDef||[]).concat(novas);novas=[];resps.push('Desculpe, eu não entendi essa palavra. O que é isso?');}
 /* repetição pedida */
 else if(c.pers.pRep>0&&novas.length&&c.repTot<3&&!pend()&&chance(c.pers.pRep)){c.repTot++;c.repPend=true;c.respDef=(c.respDef||[]).concat(novas);novas=[];resps.push(c.pers.id==='surdo'?'Como? Não ouvi direito, pode repetir mais devagar?':'Pode repetir, por favor? Não entendi bem.');}
 resps=resps.concat(novas);
 /* desvio / interrupção / ameaça */
 if(!pend()&&c.estado==='ativa'&&c.pi<=6&&c.nUtter>1&&c.desvPasso<1&&chance(c.pers.pDes+c.pers.pInt)){c.desvPasso++;c.desvTot++;c.desvioPend={tent:0};resps.push(pick(c.pers.desvios));}
 else if(!pend()&&c.pers.pCan>0&&c.pac<=30&&!c.ameacou&&c.pi<=6){c.ameacou=true;c.desvTot++;c.desvioPend={tent:0};resps.push('Se isso não for resolvido, eu vou cancelar o meu contrato!');}
 if(c.pac<=0&&c.pers.pCan>0&&!c.ameacou){c.ameacou=true;}
 var fala=resps.join(' ');

 else{aposFala();}
 Gancho.render();Gancho.estado();return true;}

function aposFala(){

  var st=c.passos[c.pi];
  for(var h=0;h<st.hooks.length;h++){var hk=st.hooks[h];var k=c.pi+':'+hk.id;

 var meta=c.passos[c.pi].meta;if(c.tempos[c.pi]>meta&&!c.penTempo[c.pi]){c.penTempo[c.pi]=1;erro('tempo','Passo '+(c.pi+1));}

function finalizar(completo){var c=CH;if(!c||c.estado==='fim')return;var agora=Date.now();
 if(c.esp){if(c.esp.tipo==='pausa')c.tme+=(agora-c.esp.ini)/1000;c.esp=null;}

 c.estado='fim';c.fim=agora;Voz.parar();Escuta.parar();Aud.fundoOff();
 /* erros de ausência */
 var f=function(pi,id){return c.feitos[pi+':'+id];};
 if(!f(1,'licenca')||!f(1,'mudo'))erro('sem_pausa');
 if(!f(3,'pausa2')&&c.pi>=3)erro('sem_pausa');

function calcular(c,completo){

 c.passos.forEach(function(st,pi){st.itens.forEach(function(i){if(!i.req)return;tot[i.cat]=(tot[i.cat]||0)+1;var f=c.feitos[pi+':'+i.id];var pulado=c.pulados&&c.pulados[pi+':'+i.id];if(f!==undefined&&!pulado)ok[i.cat]=(ok[i.cat]||0)+1;});});
 var dentro=0;for(var i=0;i<8;i++){if(c.tempos[i]!==undefined&&c.tempos[i]<=c.passos[i].meta)dentro++;}
 var cats={},soma=0,pesos=S.pesos,ratios={};
 CATS.forEach(function(k){var id=k[0];var r;if(id==='tempo')r=dentro/8;else r=(tot[id]?(ok[id]||0)/tot[id]:0);ratios[id]=r;cats[id]=Math.round(pesos[id]*r*10)/10;soma+=cats[id];});
 var capG={giria:5,desvio_ignorado:6};var cont={};
 c.erros.forEach(function(e){var d=ERROS[e.id];var p=d.pen||0;cont[e.id]=(cont[e.id]||0)+1;if(capG[e.id]&&cont[e.id]*p>capG[e.id])p=0;pen+=p;});
 pen=Math.min(20,pen);var dpen=Math.min(15,c.dicas*3);
 var nota=clamp(Math.round(soma-pen-dpen),0,100);
 var pctItens=0,nt=0,no=0;Object.keys(tot).forEach(function(k){nt+=tot[k];no+=(ok[k]||0);});pctItens=nt?no/nt:0;
 var tma=((c.fim||Date.now())-(c.inicio||Date.now()))/1000;
 var fcr=!!(completo&&pctItens>=.8);
 var npsN=clamp(Math.round(nota/10+(c.pac-c.pac0)/20),0,10);
 var uso=Math.min(c.usoNome,3)/3;var conf=ratios.confirmacao||0;var des=c.desvTot?(c.desvOk/c.desvTot):1;
 var escuta=Math.round((conf*.4+uso*.3+des*.3)*100);
 var xpGan=0,sc=c.sc;
 if(c.modo==='avaliacao'){xpGan=Math.round(nota*(1+(c.pers.dif-1)*.1));if(nota>=90)xpGan+=25;}
 var sim={_v:ESQUEMA,id:c.id,quando:new Date().toISOString(),modo:c.modo,cenarioId:sc.id,cenario:sc.nome,personaId:c.pers.id,persona:c.pers.nome,dificuldade:c.pers.dif,
  empresa:c.ctx.empresa,atendente:c.ctx.atend,completa:!!completo,nota:nota,cats:cats,pesos:cloneJ(pesos),ratios:ratios,tempos:c.tempos.map(function(x){return Math.round(x*10)/10;}),metas:c.passos.map(function(p){return p.meta;}),nomesPassos:c.passos.map(function(p){return p.nome;}),
  tma:Math.round(tma),tme:Math.round(c.tme),fcr:fcr,pctItens:Math.round(pctItens*100),nps:npsN,escuta:escuta,dicas:c.dicas,
  erros:c.erros.slice(0,40),interrup:c.interrup,xp:xpGan,paciencia:Math.round(c.pac),linha:c.linha.slice(0,300),
  checklist:c.passos.map(function(st,pi){return st.itens.map(function(i){var f=c.feitos[pi+':'+i.id];var pu=c.pulados&&c.pulados[pi+':'+i.id];return {id:i.id,t:i.label,req:i.req,ok:f!==undefined&&!pu};});})};
 return sim;}

function recomendar(sim){var menor=null,mv=2;CATS.forEach(function(k){if(k[0]==='tempo')return;var r=sim.ratios[k[0]];if(r!==undefined&&r<mv){mv=r;menor=k;}});
 var txt=[];if(sim.nota>=90)txt.push('Excelente! Experimente uma persona mais difícil para continuar evoluindo.');

/* registra a simulação: XP, sequência, conquistas */
function registrarSim(sim){
 var antesNivel=nivelAtual(S.xp);
 var hoje=hojeChave();var st=S.streak;
 if(st.ultimo!==hoje){var ontem=new Date();ontem.setDate(ontem.getDate()-1);var oc=ontem.getFullYear()+'-'+pad(ontem.getMonth()+1)+'-'+pad(ontem.getDate());
  st.dias=(st.ultimo===oc)?st.dias+1:1;st.ultimo=hoje;if(sim.modo==='avaliacao'&&st.dias>1)sim.xp+=Math.min(5,st.dias-1)*10;}

function filtroSims(f){var l=S.sims;
 if(f==='avaliacao')return l.filter(function(s){return s.modo==='avaliacao';});
 if(f==='treino')return l.filter(function(s){return s.modo!=='avaliacao';});
 if(f==='aprovadas')return l.filter(function(s){return s.nota>=70;});
 if(f==='abaixo')return l.filter(function(s){return s.nota<70;});
 if(/^erro:/.test(f)){var id=f.slice(5);return l.filter(function(s){return s.erros.some(function(e){return e.id===id;});});}
 if(/^persona:/.test(f)){var p=f.slice(8);return l.filter(function(s){return s.personaId===p;});}
 return l;}

 var pw=w-40,ph=h-30,pts=vals.map(function(v,i){return [30+i*pw/(vals.length-1),10+ph-(v/100)*ph];});
 var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
 var g='';[0,50,70,100].forEach(function(y){var py=10+ph-(y/100)*ph;g+='<line x1="30" x2="'+(w-10)+'" y1="'+py+'" y2="'+py+'" stroke="currentColor" opacity=".15"/><text x="2" y="'+(py+4)+'" font-size="10" fill="currentColor" opacity=".6">'+y+'</text>';});
 return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="Evolução das notas" style="color:var(--mut)">'+g+'<path d="'+d+'" fill="none" stroke="#0076CE" stroke-width="2.5"/>'+pts.map(function(p,i){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="#ffcb00" stroke="#040798"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]-8).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+vals[i]+'</text>';}).join('')+'</svg>';}

function mdHtml(md){var L=String(md).replace(/\r/g,'').split('\n'),o=[],lista=null,tab=false,par=[];
 function inl(s){s=esc(s);s=s.replace(/!\[([^\]]*)\]\((data:image\/[a-z]+;base64,[A-Za-z0-9+\/=]+)\)/g,'<img alt="$1" src="$2">');s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');return s;}
 function fp(){if(par.length){o.push('<p>'+inl(par.join(' '))+'</p>');par=[];}}function fl(){if(lista){o.push('</'+lista+'>');lista=null;}}function ft(){if(tab){o.push('</table>');tab=false;}}
 L.forEach(function(l){var m;
  if(/^\s*$/.test(l)){fp();fl();ft();return;}
  if((m=l.match(/^(#{1,4})\s+(.*)/))){fp();fl();ft();o.push('<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>');return;}
  if(/^---+$/.test(l)){fp();fl();ft();o.push('<hr>');return;}
  if((m=l.match(/^>\s?(.*)/))){fp();fl();ft();o.push('<blockquote>'+inl(m[1])+'</blockquote>');return;}
  if(/^\|/.test(l)){fp();fl();if(/^\|[\s:|-]+\|?$/.test(l))return;var cs=l.replace(/^\||\|$/g,'').split('|');if(!tab){tab=true;o.push('<table>');o.push('<tr>'+cs.map(function(c){return '<th>'+inl(c.trim())+'</th>';}).join('')+'</tr>');}else o.push('<tr>'+cs.map(function(c){return '<td>'+inl(c.trim())+'</td>';}).join('')+'</tr>');return;}
  if((m=l.match(/^\s*[-*]\s+(.*)/))){fp();ft();if(lista!=='ul'){fl();lista='ul';o.push('<ul>');}o.push('<li>'+inl(m[1])+'</li>');return;}
  if((m=l.match(/^\s*\d+\.\s+(.*)/))){fp();ft();if(lista!=='ol'){fl();lista='ol';o.push('<ol>');}o.push('<li>'+inl(m[1])+'</li>');return;}
  fl();ft();par.push(l.trim());});
 fp();fl();ft();return o.join('');}

nicípio.\n3. **Entrevista e testes**: proponha os testes, oriente a verificação (o cliente leva cerca de 10 s) e faça as perguntas de esclarecimento.\n4. **Protocolo e previsão**: peça ponto de referência e telefone de contato (e um segundo, se houver) e avise a nova pausa.\n5. **Gestão de pausa (10 s)**: o protocolo é gerado e aparece na tela. Peça que o cliente anote (cerca de 5 s), informe o protocolo dígito por dígito e a previsão do técnico, e confirme com o cliente.\n6. **Algo mais?**: pergunte se o cliente deseja algo mais.\n7. **Direcionamento da pesquisa**: avise do redirecionamento, peça a nota com educação e informe a pesquisa por e-mail em até 48 h.\n8. **Despedida**: agradeça e use a saudação final adequada ao horário.\n\n![Pausa com contagem regressiva](data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAA0JCgsKCA0LCgsODg0PEyAVExISEyccHhcgLikxMC4pLSwzOko+MzZGNywtQFdBRkxOUlNSMj5aYVpQYEpRUk//2wBDAQ4ODhMREyYVFSZPNS01T09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT0//wAARCAK8AWgDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAEFAgMGBAcI/8QAURAAAQMDAwEGBAIECgYJBAEFAQIDBAAFERIhMRMGFCJBUWEycYGRUqEVFiPRBzNCVFWSo7HB4RckpNLi8DZiZHKCg6Kz8SU0NVNERWN0ssL/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/8QAMREBAQACAgEDAgMIAgIDAAAAAAECEQMSIQRBURMxFJHwBSJCUmFxodGBsSMykuHx/9oADAMBAAIRAxEAPwD5/U0qa/VPMUpU1EKmlTRCppU0QpSpohU0qaIVNKVGSppU0QqaVNEKUqa evista e testes | 25 |\n| Protocolo e previsão | 20 |\n| Pausas bem conduzidas | 10 |\n| Pesquisa e despedida | 10 |\n| Tempo dentro das metas | 5 |\n\n**Métricas:** TMA (tempo médio de atendimento), TME (espera nas pausas), FCR (resolvido no primeiro contato, simulado pelo cumprimento do roteiro), NPS simulado (nota do cliente) e qualidade da escuta ativa (confirmações, uso do nome e resposta às dúvidas do cliente).\n\nAinda traz tempos por passo, erros comuns com dicas, pontos fortes e fracos, recomendação do próximo treino, checklist completo e linha do tempo. Use **Baixar PDF** para guardar o relatório e **Repetir o cenário** para treinar de novo.\n\n## 6. Desempenho, ranking e níveis\n\n- **Desempenho**: gráfico da evolução das notas e lista de simulações com filtros (todas, avaliações, treinos, aprovadas, abaixo de 70, por persona ou por erro).\n- **Ranking**: semanal, mensal e geral, mostrando só nick e pontos. Com os dados só no aparelho, mostra apenas você.\n- **Níveis**: Iniciante, Júnior, Pleno, Sênior e Especialista (0 / 500 / 1.500 / 3.500 / 7.000 XP, editáveis). Só a Avaliação gera XP.\n- **Conquistas**: primeira chamada, nota 90+, sem dica, TMA na meta, vencer persona difícil, 7 dias seguidos, todos os cenários e outras.\n\n![Ranking](data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAA0JCgsKCA0LCgsODg0PEyAVExISEyccHhcgLikxMC4 ões ou **excluir minha conta e meus dados** (exige digitar APAGAR).\n\n## 10. Supervisor e administrador\n\nO **supervisor** observa a sessão ao vivo sem intervir (passo atual, cronômetros e checklist), revisa simulações antigas e comenta. Enquanto observa, o aluno vê a faixa fixa **\"Supervisor observando\"**. O **administrador** gerencia membros e perfis, cenários oficiais e a campanha \"Compartilhe e ganhe\".\n\n## 11. Sobre, ajuda e compartilhar\n\n![Sobre](data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAA0JCgsKCA0LCgsODg0PEyAVExISEyccHhcgLikxMC4pLSwzOko+MzZGNywtQFdBRkxOUlNSMj5aYVpQYEpRUk//2wBDAQ4ODhMREyYVFSZPNS01T09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT0//wAARCAK8AWgDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAMFAgQGAQcI/8QAUhAAAQMCBAIFBwcGCgoCAwEAAQACAwQRBRIhMQYTFEFRYYEiMlJTcZGhBxUWI5Ki0kJVo7HB4RcmNmWCpLPR4vAkJTNFVGJkdYOyNPFEY3Ry/8QAGwEBAQEBAQEBAQAAAAAAAAAAAAECAwQFBgf/xAA2EQEAAQMBBQUHBQACAgMAAAAAAQIDESEEEhRBURMxodHwBRVSYXGBwTJCkbHhIjMj8XKS0v/aAAwDAQACEQMRAD8A+fr1F6v1TzCIvVEF6i9RBeovUQRF6iC9ReogvURRkXqL1EF6i9RBEXqIL1F6ogvUXqIIi9RkXqL1EF6iIgvUXqIL1F6ogvUREF6i9RBeqwwfBa3GJiykjGVvnyO0a32n9i7Oi4Fw+JoNZNLO/rAORv8Af8Vwu7Tbt6VTq627FdzWIfPUX06Xg3BHts2CSM23bK6/xuuexbgmopmGXDpTUMAuY3Cz/DqPwXOjbbVc47vqtey3KYz3uTXq9ILSQQQRoQUXqeUReoiOcRF6uj7AvV3dJguHUmAYdWDA5sYFUzNUyxyuvDtcBrezX3Kjp8Bbi+K1owiQQ4fT+W6arOQRN7Hd+/uXCm/TOekLNMq
